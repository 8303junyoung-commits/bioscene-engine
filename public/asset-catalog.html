<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BioScene Asset Library</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18372e; background: #eef4f1; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 2; padding: 22px 28px 18px; background: rgba(250,253,251,.96); border-bottom: 1px solid #d8e5df; backdrop-filter: blur(12px); }
    .topline { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.035em; }
    .sub { color: #71877e; font-size: 12px; margin-top: 5px; }
    .summary { color: #42685a; font-size: 12px; font-weight: 700; }
    .filters { display: grid; grid-template-columns: minmax(240px, 1fr) 230px 190px; gap: 9px; margin-top: 17px; }
    input, select { border: 1px solid #cfddd7; border-radius: 10px; background: white; color: #234b3e; padding: 10px 12px; outline: none; }
    input:focus, select:focus { border-color: #4b947b; box-shadow: 0 0 0 3px rgba(65,137,112,.12); }
    main { padding: 22px 28px 42px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 13px; }
    .card { min-width: 0; border: 1px solid #dbe6e1; border-radius: 14px; padding: 12px; background: #fff; box-shadow: 0 4px 15px rgba(35,72,59,.055); }
    .preview { height: 128px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: linear-gradient(145deg,#f8fbf9,#edf4f0); }
    .preview img { max-width: 110px; max-height: 108px; object-fit: contain; }
    .name { margin-top: 10px; font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { margin-top: 5px; color: #7a8e86; font-size: 9.5px; line-height: 1.45; }
    .badge { display: inline-block; margin-top: 7px; padding: 3px 6px; border-radius: 999px; background: #e7f2ed; color: #28654f; font-size: 8px; font-weight: 800; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .actions a { flex: 1; border-radius: 7px; padding: 6px 8px; text-align: center; text-decoration: none; background: #edf3f0; color: #42675a; font-size: 9px; font-weight: 700; }
    .actions a:first-child { color: white; background: #276c55; }
    .more { display: block; margin: 24px auto 0; border: 0; border-radius: 10px; padding: 10px 18px; background: #245f4d; color: white; font-weight: 750; cursor: pointer; }
    .empty { padding: 80px 20px; color: #71877e; text-align: center; }
    @media (max-width: 760px) { .filters { grid-template-columns: 1fr; } .topline { align-items: start; flex-direction: column; } header, main { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <div><h1>BioScene Asset Library</h1><div class="sub">License-aware biological SVG source bank · Bioicons</div></div>
      <div class="summary" id="summary">Loading manifest…</div>
    </div>
    <div class="filters">
      <input id="query" type="search" placeholder="Search organ, cell, tissue, receptor…" />
      <select id="category"><option value="">All categories</option></select>
      <select id="license"><option value="">All licenses</option></select>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No matching assets.</div>
    <button class="more" id="more" hidden>Show more</button>
  </main>
  <script>
    const state = { assets: [], filtered: [], visible: 160 };
    const $ = (id) => document.getElementById(id);
    const normalized = (value) => String(value || '').toLowerCase().replaceAll('_', ' ').replaceAll('-', ' ');

    function option(value) {
      const node = document.createElement('option');
      node.value = value;
      node.textContent = value.replaceAll('_', ' ');
      return node;
    }

    function render() {
      const query = normalized($('query').value).trim();
      const category = $('category').value;
      const license = $('license').value;
      state.filtered = state.assets.filter((asset) => {
        const haystack = normalized(`${asset.name} ${asset.category} ${asset.author}`);
        return (!query || haystack.includes(query)) && (!category || asset.category === category) && (!license || asset.licenseFolder === license);
      });
      $('summary').textContent = `${state.filtered.length.toLocaleString()} of ${state.assets.length.toLocaleString()} SVG assets`;
      const grid = $('grid');
      grid.replaceChildren();
      state.filtered.slice(0, state.visible).forEach((asset) => {
        const card = document.createElement('article');
        card.className = 'card';
        const preview = document.createElement('div');
        preview.className = 'preview';
        const image = document.createElement('img');
        image.loading = 'lazy';
        image.alt = asset.name;
        image.src = `/assets/bioicons-library/${asset.file}`;
        preview.append(image);
        const name = document.createElement('div');
        name.className = 'name';
        name.title = asset.name;
        name.textContent = asset.name.replaceAll('_', ' ');
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${asset.category.replaceAll('_', ' ')} · ${asset.author.replaceAll('_', ' ')}`;
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = asset.license.spdx;
        const actions = document.createElement('div');
        actions.className = 'actions';
        const download = document.createElement('a');
        download.href = image.src;
        download.download = '';
        download.textContent = 'Download SVG';
        const source = document.createElement('a');
        source.href = asset.sourceUrl;
        source.target = '_blank';
        source.rel = 'noreferrer';
        source.textContent = 'Source';
        actions.append(download, source);
        card.append(preview, name, meta, badge, actions);
        grid.append(card);
      });
      $('empty').hidden = state.filtered.length !== 0;
      $('more').hidden = state.filtered.length <= state.visible;
    }

    for (const id of ['query', 'category', 'license']) {
      $(id).addEventListener(id === 'query' ? 'input' : 'change', () => { state.visible = 160; render(); });
    }
    $('more').addEventListener('click', () => { state.visible += 160; render(); });

    fetch('/assets/bioicons-library/manifest.json')
      .then((response) => {
        if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) throw new Error('manifest missing');
        return response.json();
      })
      .then((manifest) => {
        state.assets = manifest.assets;
        Object.keys(manifest.countsByCategory).forEach((value) => $('category').append(option(value)));
        Object.keys(manifest.countsByLicenseFolder).forEach((value) => $('license').append(option(value)));
        render();
      })
      .catch(() => { $('summary').textContent = 'Could not load asset manifest'; });
  </script>
</body>
</html>
